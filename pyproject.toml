[project]
name = "zooglebookclub"
version = "0.1.0"
description = "homework"
authors = [
    {name = "siois",email = "zynthari@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "sentence-transformers (>=6.1.0,<7.0.0)",
    "qdrant-client (>=1.19.1,<2.0.0)",
    "openai (>=3.37.0,<4.0.0)",
    "ruff (>=0.17.3,<0.18.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["books/migrations"]

[tool.ruff.lint]
select = [
    "E4",  # ошибки импортов
    "E7",  # ошибки выражений
    "E9",  # синтаксические ошибки
    "F",   # неиспользуемые импорты, неопределённые имена
    "I",   # сортировка импортов
]
